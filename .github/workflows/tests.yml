name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/etapa0-catalogo-satelital

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: make setup
      - name: Lint
        run: make lint
      - name: Test
        run: make test
